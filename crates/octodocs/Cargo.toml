[package]
name = "octodocs"
description = "Octo Docs: HWPX·docx·md·txt를 같은 명령으로 고치는 문서 편집기 (CLI·MCP)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
octodocs-ohwp = { path = "../octodocs-ohwp" }
octodocs-preserve = { path = "../octodocs-preserve" }
# 진행일지 A2: 로컬 포크를 경로로 참조한다
wordcraft-engine = { path = "../../../work/wordcraft/crates/engine" }
wordcraft-doc = { path = "../../../work/wordcraft/crates/doc" }
wordcraft-fonts = { path = "../../../work/wordcraft/crates/fonts" }
# 글꼴 OS/2 표(코드 페이지·윈도 높이) — wordcraft 와 같은 판
skrifa = "0.47"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
sys-locale = "0.3"
quick-xml = "0.42"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
pdf-extract = "0.9"
png = "0.17"

[[bin]]
name = "octodocs"
path = "src/main.rs"
